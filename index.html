<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="app-wrapper">
        <h1>Simple Quiz</h1>
        <hr />
        <p>1. Which country were you born in?</p>
        <div class="answer-wrapper">
          <button class="answers">Kenya</button>
          <button class="answers">Uganda</button>
          <button class="answers">Egypt</button>
          <button class="answers">Ethiopia</button>
        </div>
        <button class="submit">Next</button>
        <button class="submit">Submit</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
